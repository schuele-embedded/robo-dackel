<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9772e"/>
      <stop offset="1" stop-color="#8f4a17"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#23262b"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="0.6" stop-color="#1b7fb8"/>
      <stop offset="1" stop-color="#0a2c40"/>
    </radialGradient>
    <g id="joint">
      <circle r="13" fill="url(#dark)" stroke="#111" stroke-width="2"/>
      <circle r="5" fill="#b9bec6"/>
      <path d="M-3 0H3M0 -3V3" stroke="#333" stroke-width="1.5"/>
    </g>
    <!-- one leg: hip at 0,0 -->
    <g id="leg">
      <rect x="-21" y="-16" width="42" height="30" rx="5" fill="url(#dark)" stroke="#111" stroke-width="2"/>
      <path d="M0 0L-22 40" stroke="#2b2e33" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 0L-22 40" stroke="#c9772e" stroke-width="8" stroke-linecap="round"/>
      <path d="M-22 40L4 78" stroke="#2b2e33" stroke-width="13" stroke-linecap="round"/>
      <path d="M-22 40L4 78" stroke="#b9bec6" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="6" cy="82" rx="13" ry="8" fill="#1a1a1a"/>
      <use href="#joint"/>
      <use href="#joint" x="-22" y="40" transform="scale(1)"/>
    </g>
  </defs>

  <rect width="860" height="420" fill="#f4f1ea"/>

  <!-- ground + shadow -->
  <ellipse cx="420" cy="334" rx="330" ry="14" fill="#000" opacity="0.12"/>
  <line x1="40" y1="334" x2="820" y2="334" stroke="#9a9488" stroke-width="2"/>

  <!-- far-side legs -->
  <g opacity="0.45">
    <use href="#leg" x="262" y="248"/>
    <use href="#leg" x="582" y="248"/>
  </g>

  <!-- tail -->
  <path d="M176 196C140 186 118 160 112 122" fill="none" stroke="#8f4a17" stroke-width="9" stroke-linecap="round"/>
  <circle cx="112" cy="122" r="6" fill="#23262b"/>

  <!-- neck -->
  <path d="M588 196L640 150" stroke="#23262b" stroke-width="34" stroke-linecap="round"/>
  <path d="M588 196L640 150" stroke="url(#shell)" stroke-width="24" stroke-linecap="round"/>

  <!-- long body -->
  <rect x="170" y="172" width="450" height="76" rx="36" fill="url(#shell)" stroke="#5c2e0c" stroke-width="3"/>
  <rect x="300" y="182" width="190" height="34" rx="8" fill="url(#dark)" stroke="#111" stroke-width="2"/>
  <g fill="#6fe36f">
    <circle cx="318" cy="199" r="4"/>
    <circle cx="334" cy="199" r="4"/>
    <circle cx="350" cy="199" r="4" fill="#f2c94c"/>
  </g>
  <g stroke="#7d848e" stroke-width="2">
    <line x1="380" y1="190" x2="474" y2="190"/>
    <line x1="380" y1="199" x2="474" y2="199"/>
    <line x1="380" y1="208" x2="474" y2="208"/>
  </g>
  <g stroke="#5c2e0c" stroke-width="2" opacity="0.6">
    <line x1="285" y1="174" x2="285" y2="246"/>
    <line x1="505" y1="174" x2="505" y2="246"/>
  </g>
  <g fill="#5c2e0c">
    <circle cx="200" cy="190" r="3"/><circle cx="200" cy="230" r="3"/>
    <circle cx="592" cy="190" r="3"/><circle cx="592" cy="230" r="3"/>
  </g>

  <!-- head -->
  <ellipse cx="664" cy="134" rx="42" ry="32" fill="url(#shell)" stroke="#5c2e0c" stroke-width="3"/>
  <!-- long snout -->
  <path d="M690 122H758Q776 122 776 140V146Q776 162 758 162H690Z" fill="url(#shell)" stroke="#5c2e0c" stroke-width="3"/>
  <line x1="704" y1="152" x2="768" y2="152" stroke="#5c2e0c" stroke-width="2"/>
  <ellipse cx="774" cy="134" rx="10" ry="8" fill="#1a1a1a"/>
  <!-- camera eye -->
  <circle cx="682" cy="124" r="11" fill="#111"/>
  <circle cx="682" cy="124" r="8" fill="url(#lens)"/>
  <circle cx="679" cy="121" r="2.2" fill="#fff"/>
  <!-- floppy ear -->
  <path d="M640 108C618 112 610 150 620 186C626 204 648 200 652 180C656 156 660 128 640 108Z" fill="#6e3711" stroke="#4a2408" stroke-width="3"/>
  <circle cx="641" cy="114" r="5" fill="#b9bec6" stroke="#333" stroke-width="1.5"/>

  <!-- near-side legs -->
  <use href="#leg" x="232" y="248"/>
  <use href="#leg" x="552" y="248"/>

  <!-- dimension hint -->
  <g stroke="#7a7468" stroke-width="1.5" fill="#7a7468" font-size="13">
    <line x1="170" y1="372" x2="620" y2="372"/>
    <line x1="170" y1="364" x2="170" y2="380"/>
    <line x1="620" y1="364" x2="620" y2="380"/>
    <text x="395" y="392" text-anchor="middle" stroke="none">long body (BODY_L ≈ 220 mm)</text>
    <line x1="60" y1="248" x2="60" y2="334"/>
    <line x1="52" y1="248" x2="68" y2="248"/>
    <line x1="52" y1="334" x2="68" y2="334"/>
    <text x="76" y="296" stroke="none">short legs</text>
  </g>

  <text x="30" y="44" font-size="24" font-weight="600" fill="#3a2a1a">Dackel-Bot</text>
  <text x="30" y="68" font-size="14" fill="#6b5d4d">concept sketch · 12× STS3215 · based on smalldog</text>
</svg>
